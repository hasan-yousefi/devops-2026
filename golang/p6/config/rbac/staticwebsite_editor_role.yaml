# This rule is not used by the project p6 itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the web.easy.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: p6
    app.kubernetes.io/managed-by: kustomize
  name: staticwebsite-editor-role
rules:
- apiGroups:
  - web.easy.com
  resources:
  - staticwebsites
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - web.easy.com
  resources:
  - staticwebsites/status
  verbs:
  - get
