# This rule is not used by the project p8 itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the janitor.mydomain.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: p8
    app.kubernetes.io/managed-by: kustomize
  name: ttlnamespace-editor-role
rules:
- apiGroups:
  - janitor.mydomain.io
  resources:
  - ttlnamespaces
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - janitor.mydomain.io
  resources:
  - ttlnamespaces/status
  verbs:
  - get
